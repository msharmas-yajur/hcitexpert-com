# The Clinical Frontier — coverage ledger
# ---------------------------------------------------------------------------
# State file for the DAILY "Clinical Frontier" series on HCITExperts Blog.
# Each day the routine reviews the latest updates from Anthropic, OpenAI,
# Google (Gemini/DeepMind), Groq, Cursor, and NVIDIA, then publishes ONE
# healthcare-contextualised article on how a frontier-model / AI-hardware
# update applies to a specific clinical or health-system scenario.
#
# Anti-repetition is keyed on `angle` (the healthcare scenario) so the same
# model update can be revisited for a different scenario, but no scenario is
# repeated. `sources` logs which announcements were referenced.
#
# The routine appends one entry per published edition. See
# scripts/clinical-frontier-runbook.md for the full procedure.
# ---------------------------------------------------------------------------

